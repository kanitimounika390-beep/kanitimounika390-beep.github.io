<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouni & Chinna - Surprise</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Baloo+2:wght@700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Fredoka',sans-serif;background:#1a0a2e;min-height:100vh;overflow-x:hidden}
.screen{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;transition:0.8s}
#screen1{background:radial-gradient(circle at 50% 30%,#3d1a5e,#1a0a2e);color:white;text-align:center}
#screen2{background:radial-gradient(circle at 30% 20%,#ffd6e7 0%,#e8ddff 35%,#d6f0ff 70%,#fff4d6 100%);display:none;color:#4a3a6b}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.15);padding:40px 30px;border-radius:30px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.4)}
.heart-big{font-size:60px;animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
h1{font-family:'Baloo 2';font-size:28px;margin:15px 0 10px}
.sub{opacity:0.8;font-size:15px;margin-bottom:20px;line-height:1.5}
.btn{border:none;padding:14px 28px;border-radius:30px;font-family:'Baloo 2';font-size:16px;font-weight:700;cursor:pointer;transition:0.3s}
.btn-light{background:white;color:#3d1a5e;box-shadow:0 8px 20px rgba(255,255,255,0.2)}
.btn-pink{background:linear-gradient(90deg,#ff8fab,#ff5a7f);color:white;box-shadow:0 8px 20px rgba(255,90,127,0.4)}
.btn:hover{transform:scale(1.05)}
.teddies{position:relative;width:100%;max-width:600px;height:220px;margin:10px 0}
.teddy{font-size:100px;position:absolute;transition:1.2s cubic-bezier(0.68,-0.55,0.27,1.55)}
#tf{left:-150px;top:10px}#tf.enter{left:12%}
#tm{right:-150px;top:10px}#tm.enter{right:12%}
.label{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-family:'Baloo 2';font-size:20px;font-weight:800;opacity:0;transition:0.6s;white-space:nowrap}
.label.show{opacity:1}
.heart-center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(0);font-size:75px;transition:0.8s}
.heart-center.show{transform:translate(-50%,-50%) scale(1);animation:heartPulse 1s infinite}
@keyframes heartPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.25)}}
.gift-area{margin-top:70
