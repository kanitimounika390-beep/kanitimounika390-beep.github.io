<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANIKANTA CARS & MACHINERY | Yeleswaram</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:10px}
.card{background:white;padding:20px;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.2);max-width:450px;margin:auto}
h2{color:#ff6600;text-align:center}
input{width:90%;padding:12px;margin:10px 0;border:2px solid #ff6600;border-radius:8px;font-size:16px}
.btn{width:100%;padding:14px;margin:8px 0;border:none;border-radius:8px;font-size:17px;font-weight:bold;color:white;cursor:pointer}
.orange{background:#ff6600} .blue{background:#007bff} .green{background:#25D366}
.fare{font-size:22px;font-weight:bold;color:green;text-align:center;margin:15px}
</style>
</head>
<body>
<div class="card">
<h2>🚜 MANIKANTA SERVICES 🚜</h2>
<p style="text-align:center">Yeleswaram | 9493086666 | 8519978199</p>
<img src="https://manikantacarsmachinery.blogspot.com/poster.jpg" style="width:100%;border-radius:10px" alt="Manikanta Cars">

<label>Enta KM vellali?</label>
<input type="number" id="km" placeholder="Ex: 50" oninput="calc()">
<div class="fare" id="fare">Fare: Rs 0</div>

<button class="btn orange" onclick="pay(100)">Pay Rs 100 Advance - GPay/PhonePe</button>
<button class="btn blue" onclick="payFull()">Pay Full Amount</button>
<button class="btn green" onclick="whatsapp()">WhatsApp lo Book Cheyyi</button>

<p style="font-size:13px;text-align:center;margin-top:15px">✅ JCB | Tractor | Car Services Available</p>
</div>

<script>
let total=0;
function calc(){
 let km=document.getElementById('km').value;
 total=km*50; // 1KM = Rs 50 - nuvvu marchukovachu
 document.getElementById('fare').innerText='Fare: Rs '+total;
}
function pay(amt){
 let upi="9493086666@upi"; // NEE UPI ID IKKADA PETTU
 window.location.href="upi://pay?pa="+upi+"&pn=Manikanta&am="+amt+"&cu=INR";
}
function payFull(){
 if(total==0){alert('KM enter cheyyi ra!');return}
 pay(total);
}
function whatsapp(){
 let km=document.getElementById('km').value||0;
 let msg=`Hi Manikanta Anna, Naaku ${km} KM ki Service kavali. Fare Rs ${total}. Yeleswaram.`;
 window.open("https://wa.me/919493086666?text="+encodeURIComponent(msg));
}
</script>
</body>
</html>
