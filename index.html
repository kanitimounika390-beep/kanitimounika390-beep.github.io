<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mounika - Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#1a0b2e;color:white;display:flex;min-height:100vh}
.sidebar{width:260px;background:#241042;padding:25px;text-align:center}
.profile img{width:100px;height:100px;border-radius:50%;border:3px solid #a855f7}
.menu{margin-top:30px;text-align:left}
.menu div{padding:14px;background:#2d1b4e;margin:8px 0;border-radius:10px;cursor:pointer}
.menu div:hover{background:#a855f7!important}
.main{flex:1;padding:30px}
.login{max-width:380px;margin:80px auto;background:#241042;padding:30px;border-radius:15px;text-align:center}
.login input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #3a2460;background:#1a0b2e;color:white}
.login button{width:100%;padding:12px;background:linear-gradient(90deg,#a855f7,#ec4899);border:none;border-radius:8px;color:white;font-weight:bold;margin-top:10px
